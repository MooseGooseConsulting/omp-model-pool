name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Fetch pinned OMP binary for E2E
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/omp-linux-x64" \
            "https://github.com/can1357/oh-my-pi/releases/download/v19.2.1/omp-linux-x64"
          echo "e8b937f9bf023baa147bdd300ad5421af0a6ef8b1f350c47a9a93d5fca94feca  $RUNNER_TEMP/omp-linux-x64" > "$RUNNER_TEMP/omp-linux-x64.sha256"
          cd "$RUNNER_TEMP" && sha256sum --check --strict "omp-linux-x64.sha256"
          chmod +x "$RUNNER_TEMP/omp-linux-x64"
      - name: E2E against real OMP (loopback fixture)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: npm run test:e2e
        env:
          OMP_BIN: ${{ runner.temp }}/omp-linux-x64
